# Clarity 5, unlike the rest of this project: mia-smart-faktory uses
# as-contract? with with-ft / with-stx allowances, which do not exist before
# Clarity 5. Everything else here predates that and stays on 3.
[contracts.mia-smart-faktory]
path = 'contracts/mia-smart-faktory.clar'
clarity_version = 5
epoch = 'latest'

[contracts.prelaunch-faktory-trait]
path = 'contracts/prelaunch-faktory-trait.clar'
clarity_version = 3
epoch = 'latest'
[repl.analysis]
passes = ['check_checker']

[repl.analysis.check_checker]
strict = false
trusted_sender = false
trusted_caller = false
callee_filter = false

[repl.remote_data]
enabled = false
api_url = 'https://api.hiro.so'

[contracts.pepe-smart-faktory]
path = 'contracts/pepe-smart-faktory.clar'
clarity_version = 5
epoch = 'latest'

# flatearth-smart-faktory is deliberately NOT in the manifest: flat-earth-stxcity
# and flat-earth-stxcity-dex reference each other, so clarinet cannot order the
# FLAT token and everything downstream (the fak pool) reports as unresolved -
# the same reason the flatearth-arbitrage contracts are validated with stxer
# (simul-flatearth-arb-v2.js) instead. To type-check the router, copy it with
# the PEPE token/pool principals substituted (identical interfaces) and check
# that; see README-flatearth-smart.md.
